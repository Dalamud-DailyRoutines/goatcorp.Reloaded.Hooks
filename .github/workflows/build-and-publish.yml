name: Build and Publish

on:
  push:
    branches: [ master, modified ]
    tags:
      - '*'
  pull_request:
    branches: [ master, modified ]
  workflow_dispatch:

env: 
  CODE_COVERAGE_PATH: ./Coverage.xml
  RELOADED_HOOKS_NUPKG_GLOB: ./source/Reloaded.Hooks/bin/Release/*.nupkg
  RELOADED_HOOKS_DEFINITIONS_NUPKG_GLOB: ./source/Reloaded.Hooks.Definitions/bin/Release/*.nupkg
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v3
      with:
        # Optional SDK version(s) to use. If not provided, will install global.json version when available. Examples: 2.2.104, 3.1, 3.1.x
        dotnet-version: 10.0.x
    
    - name: Get Dotnet Info
      run: dotnet --info
      
    - name: Build
      run: dotnet build -c Release ./source/Reloaded.Hooks.sln
      
    - name: Test
      run: |
           dotnet tool install --global altcover.global --version 8.2.833
           $ipmo = (AltCover ImportModule | Out-String)
           Invoke-Expression $ipmo
    
           dotnet test -f net10.0 .\source\Reloaded.Hooks.Tests.X86\Reloaded.Hooks.Tests.X86.csproj /p:AltCover=true /p:CopyLocalLockFileAssemblies="true" /p:AltCoverAttributeFilter="ExcludeFromCodeCoverageAttribute" /p:AltCoverAssemblyExcludeFilter="Reloaded.Hooks.Tests.X86|Reloaded.Hooks.Tests.X64|Reloaded.Hooks.Tests.Shared|xunit\.*" /p:AltCoverTypeFilter="xunit\.*|AltCover\.*|Reloaded\.Assembler.*" /p:AltCoverReport="../../coverage-86.xml"
           dotnet test -f net10.0 .\source\Reloaded.Hooks.Tests.X64\Reloaded.Hooks.Tests.X64.csproj /p:AltCover=true /p:CopyLocalLockFileAssemblies="true" /p:AltCoverAttributeFilter="ExcludeFromCodeCoverageAttribute" /p:AltCoverAssemblyExcludeFilter="Reloaded.Hooks.Tests.X86|Reloaded.Hooks.Tests.X64|Reloaded.Hooks.Tests.Shared|xunit\.*" /p:AltCoverTypeFilter="xunit\.*|AltCover\.*|Reloaded\.Assembler.*" /p:AltCoverReport="../../coverage-64.xml"
           
    - name: Upload NuGet Package Artifact
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: NuGet Packages
        # A file, directory or wildcard pattern that describes what to upload
        path: |
          ${{ env.RELOADED_HOOKS_NUPKG_GLOB }}
          ${{ env.RELOADED_HOOKS_DEFINITIONS_NUPKG_GLOB }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Download NuGet Package Artifact
      uses: actions/download-artifact@v4
      with:
        name: NuGet Packages
        path: ./packages

    - name: NuGet Login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    # Only goatcorp.* because we don't publish our own definitions package yet
    - name: Upload to NuGet
      env:
        NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        $items = Get-ChildItem -Path "./packages" -Filter "goatcorp.*.nupkg" -Recurse
        Foreach ($item in $items)
        {
            Write-Host "Pushing $item"
            dotnet nuget push "$item" -k "$env:NUGET_KEY" -s "https://api.nuget.org/v3/index.json" --skip-duplicate
        }
